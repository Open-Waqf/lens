name: Android Release Build

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Android versionCode"
        required: false
        default: "1"
      version_name:
        description: "Android versionName"
        required: false
        default: "0.1.0"

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      CI: true
      OWQ_ANDROID_VERSION_CODE: ${{ inputs.version_code }}
      OWQ_ANDROID_VERSION_NAME: ${{ inputs.version_name }}
      OWQ_ANDROID_STORE_FILE: ${{ secrets.OWQ_ANDROID_STORE_FILE }}
      OWQ_ANDROID_STORE_PASSWORD: ${{ secrets.OWQ_ANDROID_STORE_PASSWORD }}
      OWQ_ANDROID_KEY_ALIAS: ${{ secrets.OWQ_ANDROID_KEY_ALIAS }}
      OWQ_ANDROID_KEY_PASSWORD: ${{ secrets.OWQ_ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Decode Signing Keystore (optional)
        if: ${{ env.OWQ_ANDROID_STORE_FILE != '' }}
        run: |
          echo "${OWQ_ANDROID_STORE_FILE}" | base64 -d > android/app/release.keystore
          echo "OWQ_ANDROID_STORE_FILE=$(pwd)/android/app/release.keystore" >> $GITHUB_ENV

      - name: Build Release APK + AAB
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease

      - name: Upload Android Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-artifacts
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
