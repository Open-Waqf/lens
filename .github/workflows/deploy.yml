name: Check and Deploy
# Every push to develop, and every pull request into develop (e.g. Dependabot), runs the
# checks. Nothing is deployed.
# Pushing a version tag (vX.Y.Z, made by `npm run release`) runs the checks and, only if
# they pass, deploys lens.open-waqf.org.
on:
  push:
    branches:
      - develop
    tags:
      - 'v*'
    paths-ignore: # not applied to tag pushes
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - 'docs/**'
  pull_request:
    branches:
      - develop
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - 'docs/**'

permissions:
  contents: write

# A newer push to the same branch or tag cancels the older run.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # 0. A release tag must match the version in package.json
      - name: Check Tag Matches Version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}"
            exit 1
          fi

      - name: Install Dependencies
        run: npm ci

      # 1. Fast checks first: a typo fails in seconds, not after the test suite.
      - name: Typecheck
        run: npm run typecheck

      - name: Check Translations
        run: npm run check-i18n

      - name: Check Copied Package Files
        run: node scripts/check-pinned.mjs

      - name: Unit Tests
        run: npm run test:unit

      # 2. Playwright browsers, cached between runs.
      - name: Cache Playwright Browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Browsers come from the cache, but Ubuntu still needs their system libraries.
      - name: Install Playwright OS Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # 3. Build for production and run every browser test (phone, Arabic, desktop with the
      #    timing gates) against that build. Every test also fails if the app tries to reach
      #    the network. The same dist/ is what gets deployed below.
      - name: Build and Test the Production Build
        run: npm run test:build

      - name: Upload Test Report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      # 4. Deploy (only on a release tag, and only if everything above passed)
      - name: Copy CNAME
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "lens.open-waqf.org" > dist/CNAME

      - name: Deploy to Deploy Branch
        if: startsWith(github.ref, 'refs/tags/v')
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: deploy
          clean: true
          git-config-name: "Open Waqf Bot"
          git-config-email: "bot@open-waqf.org"
          commit-message: "deploy: update lens (automated)"

  # The Android app, built in parallel with the checks above. It catches what the web tests
  # cannot: a Capacitor or plugin update (Dependabot) that breaks the Gradle build, or a
  # dependency that brings an analytics or crash-reporting SDK into the app. The signed
  # bundle for Google Play is still made on your computer (`npm run release`).
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets and Sync Android
        run: |
          npm run build
          npx cap sync android

      - name: Build the Android App (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Scan for Telemetry SDKs
        run: npm run test:no-telemetry
