name: Performance Gates

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/e2e/perf-gates.spec.ts'
      - 'package.json'
      - '.github/workflows/perf.yml'

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build

      - name: Run performance gates
        run: CI=1 npm run test:perf

      - name: Upload performance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-artifacts
          path: |
            artifacts/perf-report.json
            artifacts/perf-summary.md
            playwright-report
            test-results
          if-no-files-found: warn

